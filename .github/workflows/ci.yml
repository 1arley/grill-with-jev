name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --prefix skills/productivity/grill-with-jev
      - run: npm run --prefix skills/productivity/grill-with-jev typecheck
      - run: npm test --prefix skills/productivity/grill-with-jev
      - run: npm run --prefix skills/productivity/grill-with-jev eval:mock
      - run: npm run --prefix skills/productivity/grill-with-jev eval:canary
      - run: npm run --prefix skills/productivity/grill-with-jev eval:budget

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
